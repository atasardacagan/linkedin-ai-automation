[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-ai-automation"
version = "0.1.0"
description = "Human-approved AI content automation for LinkedIn"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "apscheduler>=3.10,<4", "asyncpg>=0.30,<1", "dateparser>=1.2,<2",
  "fastapi>=0.115,<1", "httpx>=0.28,<1", "openai>=3.8,<4",
  "pydantic-settings>=2.8,<3", "python-dotenv>=1,<2", "python-telegram-bot>=22,<23",
  "sqlalchemy[asyncio]>=2.0.38,<3", "structlog>=25,<26",
  "tenacity>=9,<10", "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_automation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
